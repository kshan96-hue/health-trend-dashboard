<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건강기능식품 시장 트렌드 대시보드</title>
<meta name="description" content="일일·주간·월간으로 누적되는 건강기능식품 시장·규제·제형·유튜브·검색·커머스 랭킹 대시보드. 아하핏 적합함(품질·기능·가격) 기준.">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f4f7fa;
  --card:#ffffff;
  --ink:#0f172a;
  --ink2:#334155;
  --muted:#64748b;
  --line:#e2e8f0;
  --teal:#0d9488;
  --teal-2:#14b8a6;
  --teal-l:#f0fdfa;
  --indigo:#4f46e5;
  --indigo-l:#eef2ff;
  --amber:#b45309;
  --amber-l:#fffbeb;
  --rose:#be123c;
  --rose-l:#fff1f2;
  --sky:#0369a1;
  --sky-l:#f0f9ff;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 26px -16px rgba(15,23,42,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none !important}
a{color:#0f766e;text-decoration:none;border-bottom:1px solid rgba(15,118,110,.3)}
a:hover{border-bottom-color:#0f766e}
h1,h2,h3,h4{margin:0;line-height:1.32;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding-left:1.1em}
code{font-size:.92em;background:#f1f5f9;border-radius:4px;padding:1px 4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- english briefing ---------- */
.enbrief{background:linear-gradient(180deg,#ecfdf5 0%,#ffffff 100%);border-bottom:1px solid #99f6e4}
.enbrief .enbrief-in{padding:14px 0 16px}
.eb-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.eb-flag{font-size:19px;line-height:1.25}
.eb-titles{min-width:0;flex:1 1 240px}
.eb-head h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eb-head h2 .eb-k{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:#0f766e;background:#ccfbf1;border-radius:6px;padding:3px 7px;text-transform:uppercase}
.eb-title{font-size:13px;font-weight:700;color:var(--ink2);margin-top:3px}
.eb-dur{font-weight:600;color:var(--muted)}
.eb-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ebbtn{appearance:none;border:1px solid #0d9488;background:#0d9488;color:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.4;transition:background .12s}
.ebbtn:hover:not(:disabled){background:#0f766e}
.ebbtn.ghost{background:#fff;color:#0f766e;border-color:#5eead4}
.ebbtn.ghost:hover:not(:disabled){background:#f0fdfa}
.ebbtn:disabled{opacity:.4;cursor:default}
.ebbtn.eb-toggle{margin-left:auto}
.ebrates{display:inline-flex;gap:2px;background:#fff;border:1px solid #5eead4;border-radius:10px;padding:2px}
.ebrates button{appearance:none;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:#0f766e;padding:5px 9px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.ebrates button:hover{background:#f0fdfa}
.ebrates button[aria-pressed="true"]{background:#0d9488;color:#fff}
.ebrates button[aria-pressed="true"]:hover{background:#0d9488}
.eb-note{font-size:11.5px;color:var(--muted);font-weight:600}
.eb-note.warn{color:var(--amber)}
.eb-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.eb-list li{display:flex;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:13.5px;line-height:1.6;color:var(--ink2);transition:background .12s,border-color .12s,box-shadow .12s}
.eb-list li:hover{border-color:#5eead4;background:#f7fffd}
.eb-list li .n{flex:0 0 auto;width:20px;color:var(--muted);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;padding-top:3px}
.eb-list li.on{border-color:#0d9488;background:#d7fbf3;box-shadow:inset 3px 0 0 #0d9488;color:var(--ink);font-weight:600}
.eb-list li.on .n{color:#0f766e}
.eb-list.noaudio li{cursor:default}
.eb-list.noaudio li:hover{border-color:var(--line);background:#fff}
@media (max-width:720px){
  .eb-list{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
  .eb-list li{font-size:13px;padding:8px 10px}
  .eb-ctrl{gap:6px}
  .ebbtn{padding:7px 12px;font-size:12.5px}
  .eb-ctrl .eb-note{flex:1 1 100%}
}

/* ---------- header ---------- */
header.top{
  background:
    radial-gradient(900px 320px at 8% -20%, #ccfbf1 0%, rgba(204,251,241,0) 62%),
    radial-gradient(760px 300px at 92% -30%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
    linear-gradient(180deg,#fbfdfd 0%, #f4f7fa 100%);
  border-bottom:1px solid var(--line);
}
.top-inner{padding:26px 0 22px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:#0f766e;text-transform:uppercase}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#0d9488;box-shadow:0 0 0 4px rgba(13,148,136,.14)}
h1{font-size:clamp(21px,2.6vw,30px);font-weight:800;margin:8px 0 8px;letter-spacing:-.03em}
.lede{font-size:13.5px;color:var(--muted);max-width:880px}
.lede b{color:var(--ink2)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{
  display:inline-flex;align-items:baseline;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2);
  box-shadow:0 1px 1px rgba(15,23,42,.03);
}
.badge small{font-size:11.5px;font-weight:700;color:var(--muted)}
.badge strong{font-weight:800;color:var(--ink)}
.badge.strong{background:#0d9488;border-color:#0d9488;color:#fff}
.badge.strong small,.badge.strong strong{color:#d1fae5}

/* ---------- report bar ---------- */
.reportbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:saturate(140%) blur(10px);
  -webkit-backdrop-filter:saturate(140%) blur(10px);
}
.reportbar .inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0}
.periods{display:inline-flex;gap:3px;background:#eef2f7;border-radius:11px;padding:3px}
.periods button{
  appearance:none;border:0;background:transparent;font:inherit;font-size:13px;font-weight:800;
  color:#475569;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.periods button:hover{color:#0f172a}
.periods button[aria-selected="true"]{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(15,23,42,.14)}
.periodnav{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0}
.navbtn{
  appearance:none;border:1px solid #cbd5e1;background:#fff;border-radius:9px;
  width:33px;height:33px;display:grid;place-items:center;font-size:13px;color:#334155;cursor:pointer;
  flex:0 0 auto;
}
.navbtn:hover:not(:disabled){background:#f8fafc}
.navbtn:disabled{opacity:.32;cursor:default}
.datepick{position:relative;min-width:0}
.datepick select{
  appearance:none;-webkit-appearance:none;border:1px solid #cbd5e1;background:#fff;border-radius:9px;
  font:inherit;font-size:13px;font-weight:700;color:#0f172a;padding:7px 30px 7px 11px;
  max-width:250px;width:100%;cursor:pointer;
}
.datepick select:disabled{color:#94a3b8;cursor:default}
.datepick::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:#64748b;font-size:11px}
.report-meta{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.report-meta b{color:var(--ink2);font-weight:800}

/* ---------- tabs ---------- */
.tabbar{background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  appearance:none;border:1px solid transparent;background:transparent;
  font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);
  padding:9px 14px;border-radius:10px;white-space:nowrap;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
  transition:background .15s,color .15s,border-color .15s;
}
.tabs button:hover{background:#f1f5f9;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:#0f172a;color:#fff;border-color:#0f172a}

/* ---------- layout ---------- */
main{padding:22px 0 10px}
.panel{display:block}
.block{margin:0 0 30px}
.block-head{margin:0 0 14px}
.block-head h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.block-head h2 .tag{
  font-size:11px;font-weight:800;letter-spacing:.04em;color:#0f766e;background:#ccfbf1;
  border-radius:6px;padding:3px 7px;
}
.block-head p{font-size:13px;color:var(--muted);margin-top:5px;max-width:900px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;
}
.card.pad-lg{padding:22px}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.card .cap{font-size:12.5px;color:var(--muted);margin-bottom:12px}

/* ---------- KPI ---------- */
.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#0d9488)}
.kpi-a{--k:#0d9488}
.kpi-b{--k:#4f46e5}
.kpi-c{--k:#0369a1}
.kpi-d{--k:#b45309}
.kpi .k-label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em}
.kpi .k-value{font-size:26px;font-weight:800;letter-spacing:-.035em;margin:7px 0 3px;line-height:1.15}
.kpi .k-value .unit{font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:0}
.kpi .k-delta{font-size:12.5px;font-weight:700;color:var(--ink2)}
.kpi .k-foot{font-size:12px;color:var(--muted);margin-top:auto;padding-top:11px}
.kpi .k-foot span{display:block}
.kpi .k-foot span+span{margin-top:3px}
.mini-tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-right:5px}
.mt-downdown{background:var(--rose-l);color:#9f1239}
.mt-up{background:#ecfdf5;color:#047857}
.mt-neutral{background:#f1f5f9;color:#475569}
.mt-amber{background:var(--amber-l);color:var(--amber)}
.mt-indigo{background:var(--indigo-l);color:#4338ca}

/* ---------- headline list ---------- */
.headline{display:flex;gap:14px;padding:16px 0;border-bottom:1px dashed var(--line)}
.headline:first-child{padding-top:0}
.headline:last-child{border-bottom:0;padding-bottom:0}
.headline .no{
  flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:#0f172a;color:#fff;font-weight:800;font-size:13px;
}
.headline h4{font-size:14.5px;font-weight:800;margin-bottom:3px}
.headline p{font-size:13.5px;color:var(--ink2)}
.headline p .hl{background:linear-gradient(transparent 58%, #99f6e4 58%);font-weight:700;color:var(--ink)}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.strip .cell{padding:14px 14px;border-right:1px solid var(--line)}
.strip .cell:last-child{border-right:0}
.strip .cell b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.strip .cell span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

/* ---------- bars ---------- */
.bars{display:grid;gap:13px}
.bar{display:grid;grid-template-columns:minmax(120px,31%) minmax(0,1fr) 76px;align-items:center;gap:12px}
.bar .lbl{font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.35}
.bar .lbl small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px}
.bar .track{height:20px;background:#f1f5f9;border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--teal-2),var(--teal));min-width:4px}
.bar .fill.indigo{background:linear-gradient(90deg,#818cf8,#4f46e5)}
.bar .fill.sky{background:linear-gradient(90deg,#38bdf8,#0369a1)}
.bar .fill.amber{background:linear-gradient(90deg,#fbbf24,#d97706)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:13.5px;color:var(--ink)}
.bar .val small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}

/* ---------- columns (age) ---------- */
.cols{display:flex;align-items:flex-end;gap:8px;padding:6px 2px 0;max-width:660px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .cval{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:5px;font-variant-numeric:tabular-nums;line-height:1.2}
.col .cbar{width:100%;max-width:48px;background:linear-gradient(180deg,#5eead4,#0d9488);border-radius:8px 8px 4px 4px;min-height:3px}
.col .cbar.mid{background:linear-gradient(180deg,#99f6e4,#14b8a6)}
.col .cbar.top{background:linear-gradient(180deg,#0f172a,#334155)}
.col .cname{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:7px}

/* ---------- donut ---------- */
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:126px;height:126px;border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto}
.donut::after{content:"";position:absolute;inset:17px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #f1f5f9}
.donut .dv{position:relative;z-index:1;text-align:center;font-weight:800;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.donut .dv small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.02em}
.legend{display:grid;gap:8px;font-size:12.5px;min-width:120px}
.legend div{display:flex;align-items:center;gap:7px;color:var(--ink2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- keywords ---------- */
.search{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.search input[type="text"]{
  flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;
  font:inherit;font-size:13.5px;background:#fff;color:var(--ink);
}
.search input[type="text"]:focus{outline:2px solid #99f6e4;outline-offset:1px;border-color:#0d9488}
.search .count{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;padding:7px 11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.chk input{margin:0;width:15px;height:15px;accent-color:#0d9488}
.kws{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
.kw{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;min-width:0}
.kw .r{
  flex:0 0 auto;min-width:24px;height:22px;display:grid;place-items:center;border-radius:6px;
  background:#f1f5f9;color:#475569;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;
}
.kw .k{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw .tag{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.02em;padding:2px 5px;border-radius:5px;background:var(--sky-l);color:var(--sky)}
.kw.key{border-color:#5eead4;background:var(--teal-l)}
.kw.key .r{background:#0d9488;color:#fff}
.kw.key .k{color:#0f766e}
.kw.key .tag{background:#ccfbf1;color:#0f766e}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#f8fafc;font-weight:800;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-weight:600;color:var(--ink)}
.rank{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;background:#f1f5f9;color:#334155;font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums}
.rank.top3{background:#0f172a;color:#fff}
.sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:2px 0 0}
.tl li{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line);margin-left:7px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.tl li.risk::before{border-color:#e11d48}
.tl li.proc::before{border-color:#4f46e5}
.tl .d{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:#0f766e;font-variant-numeric:tabular-nums}
.tl li.risk .d{color:#be123c}
.tl li.proc .d{color:#4338ca}
.tl h4{font-size:14px;font-weight:800;margin:2px 0 3px}
.tl p{font-size:13px;color:var(--ink2)}
.tl .src{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;border:0}

/* ---------- callouts ---------- */
.callout{border-left:4px solid var(--teal);background:var(--teal-l);border-radius:0 12px 12px 0;padding:13px 15px;font-size:13px;color:#134e4a}
.callout.warn{border-color:#f59e0b;background:var(--amber-l);color:#78350f}
.callout.info{border-color:#6366f1;background:var(--indigo-l);color:#312e81}
.callout.risk{border-color:#e11d48;background:var(--rose-l);color:#881337}
.callout b{font-weight:800}
.callout ul{margin:6px 0 0;font-size:12.5px}
.callout li{margin:3px 0}

/* ---------- fit lens ---------- */
.fitcrit{position:relative}
.fitcrit .fitno{font-size:11px;font-weight:800;letter-spacing:.12em;color:#0d9488}
.fitcrit h3{font-size:16.5px;margin:4px 0 2px}
.fitq{font-size:12.5px;font-weight:700;color:#0f766e;margin-bottom:9px}
.fitcrit p.list-tight{font-size:12.8px}
.fitquote{margin-top:14px;background:linear-gradient(180deg,#f0fdfa,#fff)}
.fitquote .q{font-size:16px;font-weight:700;line-height:1.6;letter-spacing:-.01em}
.fitquote .qs{font-size:11.5px;color:var(--muted);margin-top:6px}
.fitquote .pr{margin-top:14px}
.fitline{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.fitchip{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:#f1f5f9;color:#475569}
.fitchip.on{background:#ccfbf1;color:#0f766e}
.fitchip.mid{background:var(--amber-l);color:var(--amber)}
.fitchip.off{background:var(--rose-l);color:#9f1239}

pots in convenience store sales.","On the food side, Maeil's protein bars cut the size to forty grams and sugar below two grams, so a protein bar now reads as a meal, not a snack.","Third, search. Omega-3, magnesium lactate, and magnesium held the top three, while melatonin moved up two places to eighth.","NMN dropped out of the top twenty and a bone-health ingredient came in, so anti-aging interest looks to be moving from NMN toward CoQ10 and bone health.","On YouTube this week, two themes won: value picks from Costco and Daiso, and anti-aging claims built around CoQ10 and NMN.","Daiso supplement shorts passed two million views each, so price-led comparison content is reaching a far wider audience than ingredient science.","Finally, commerce. A creatine powder ranked eighth on Coupang by units sold at about twenty-one thousand won, which tells us strength supplements are moving from gym users to everyday consumers."]},"views":{"summary":[{"kind":"kpis","title":"핵심 지표 4","tag":"KPI","desc":"규제는 표현으로, 시장은 신제품과 소용량으로 움직였습니다 — 2026-11-26 조사 기준.","items":[{"label":"① 정책 — AI 가상 전문가 금지","value":"11/27","unit":"시행","delta":"<span class=\"mini-tag mt-amber\">D-1</span>식약처 2026-11-26 발표","foot":["AI로 만든 의사·약사·교수가 제품 추천·보증하는 광고 금지","&lsquo;가상인물&rsquo; 표시를 붙여도 금지 — 5년 이하 징역 또는 5,000만원"]},{"label":"② 신제품 — 11/24~26 확인분","value":"9","unit":"건","delta":"<span class=\"mini-tag mt-indigo\">건기식 7 · 건강식품 2</span>출시일 기준","foot":["다이소 시니어 라인 확장 — 은행잎 1정 · PS 분말 스틱","1정·1포 복합(15중·17중)과 액상+정제 이중제형이 동시에","건강식품은 저당·고단백 소용량(40g 바, 30g 생식)"]},{"label":"③ 검색 — 전일 대비 첫 비교","value":"멜라토닌 ▲2","unit":"위","delta":"<span class=\"mini-tag mt-up\">10 → 8위</span>뉴케어구수한맛 11 → 9위","foot":["1~3위 오메가3 · 젖산마그네슘 · 마그네슘 유지","비타민C 5 → 4위, 유산균 4 → 5위","비타민D 8 → 10위, 베르베린 9 → 11위"]},{"label":"④ 커머스 — 크레아틴의 등장","value":"8","unit":"위","delta":"<span class=\"mini-tag mt-up\">쿠팡 판매량순</span>뉴트리코스트 크레아틴 분말","foot":["300g 20,900원 · 리뷰 2.3만","상위 7개 중 5개가 비타민·미네랄·유산균 대용량 정제","근력 보충제가 헬스 층을 넘어 대중 보충제로"]}]},{"kind":"headlines","title":"한 줄 요약","tag":"4","items":[{"h":"규제의 무게중심이 &lsquo;성분&rsquo;에서 &lsquo;표현&rsquo;으로 완전히 옮겨갔습니다","html":"11/27부터 <span class='hl'>AI로 만든 가상 전문가가 제품을 권하는 광고는 표시를 붙여도 금지</span>됩니다. 1차 위반 영업정지 15일, 형사처벌은 5년 이하 징역 또는 5,000만원. 같은 주에 방미심위는 포스파티딜세린을 &lsquo;치매 예방&rsquo;으로 오인시킨 방송 11건에 &lsquo;주의&rsquo;를 의결했습니다(11/23). 성분이 적법해도 말이 넘으면 걸립니다."},{"h":"신제품은 세 갈래로 갈렸습니다 — 다이소 시니어 · 1정 복합 · 이중제형","html":"안국약품이 다이소에 <b>은행잎 징코(1정 9중)</b>와 <b>PS 포스파티딜세린 분말 스틱</b>을 냈고, 뉴온은 목련꽃봉오리 한 원료로 <b>15중 복합 1정</b>을 홈쇼핑에 올립니다. 보고신약은 <b>50mL 액상 + 정제 2정</b>을 한 병에 담았습니다. 건강식품 쪽은 매일유업 셀렉스(40g·단백질 12g·당류 1.7g), NS홈쇼핑 저당생식(30g·당류 0.7g)처럼 <span class='hl'>단위를 줄이고 당을 낮추는</span> 방향입니다."},{"h":"편의점 건기식의 주인은 30대 직장인입니다","html":"GS25 건기식은 전 분기 대비 1분기 3.0% → 2분기 7.5% → <span class='hl'>3분기 15.2%</span>, 오피스 상권만 보면 21.2%. 구매 비중은 <b>30대 26.1%</b>로 1위(40대 25.5%)입니다. 같은 기간 전체 시장 소비자는 50대 28.0%·60대 24.8% — <span class='hl'>채널이 다른 연령을 데려오고 있습니다</span>. GS25 상반기 매출 1~3위는 모두 액상+정제 이중제형."},{"h":"검색 판은 거의 그대로, 안쪽에서만 두 칸씩 움직였습니다","html":"1~3위(오메가3·젖산마그네슘·마그네슘)는 이틀째 그대로입니다. 움직인 것은 <b>멜라토닌 10→8</b>, <b>뉴케어구수한맛 11→9</b>, <b>비타민C 5→4</b>가 올라오고 비타민D·베르베린이 두 칸 내려온 정도. 20위에는 <span class='hl'>&lsquo;뼈엔엠비피mbp&rsquo;가 새로 들어오고 NMN이 권외로</span> 밀렸습니다. 유행은 급변하지 않고, 조회 기간이 하루 밀린 만큼의 이동이 그대로 보입니다."}]},{"kind":"list","title":"그 외 이번 주(11/24~26) 확인된 신제품","tag":"신제품 축","items":["<b>대상웰라이프 것시스 &lsquo;면역 앤 비피더스 유산균&rsquo;</b>(11/25) — 비피더스 5종, 하루 1캡슐 100억 CFU(식약처 고시 최대치), 핵심 균주 HY8002(특허 7건), 아연·셀레늄 각 1일 기준치 100%, SP 특허 코팅, 유산균 전용 용기 &lsquo;액티브 바이알&rsquo;, 식물성 캡슐 1.8cm.","<b>플러스엑스팜 &lsquo;코큐텐폴리 플러스&rsquo; 리뉴얼</b>(11/24) — 코엔자임Q10 100mg(식약처 일일섭취량 90~100mg 상한)에 비타민C 50mg·셀렌 27.5μg·망간 1.5mg 추가. 제형을 경질캡슐 450mg에서 <b>연질캡슐 800mg</b>으로, 60캡슐 2개월분. 약국 전용.","<b>두드림 &lsquo;슬림웨이 다이어트&rsquo; 리뉴얼</b>(11/25) — 해국추출물(클로로겐산 380% 농축, 1일 700mg)과 체지방 감소균 HY7601·KY1032(100억 CFU, FDA NDI 등재·Self-GRAS)를 한 포에. 17중 복합 기능성, 1일 1포.","<b>KGC 정관장 &lsquo;아이패스&rsquo;</b>(11/25 보도) — 5~6월 매출이 연초의 약 1.2배, 8~9월에 다시 1.2배. 비타민B군을 더한 &lsquo;에너지샷&rsquo;은 액상+정제 이중제형으로 추석 매출이 전년 대비 약 2.3배. 업계는 어린이·청소년 건기식 시장을 5,000억원 규모로 봅니다."]},{"kind":"strip","title":"숫자 한눈에","tag":"2026-11-26","cells":[{"b":"9건","s":"신제품 (11/24~26 확인)"},{"b":"15중","s":"잇몸탄탄 복합 기능성"},{"b":"1정","s":"하루 섭취 (뉴온·안국 징코)"},{"b":"26.1%","s":"편의점 건기식 30대 비중"},{"b":"15.2%","s":"GS25 3분기 전분기 대비"},{"b":"24.03%","s":"현대바이오랜드 건기식 유통 비중"},{"b":"2,083%","s":"센트룸 맨 비타민B군 최대"}],"note":"현대바이오랜드 수치는 2025년 연결매출 대비입니다(매출 313억6,606만원 / 연결 1,305억512만원). 회사는 12/31 건기식 브랜드 유통사업을 종료한다고 11/25 공시했습니다."},{"kind":"fitlens","title":"아하핏 적합함 렌즈","tag":"판단 기준","desc":"이 대시보드의 모든 기회 판단은 아하핏이 지켜온 세 가지 기준으로 정렬합니다. 제형(정제·캡슐·분말·스틱·액상·음료·구미)은 목적이 아니라 수단입니다.","criteria":[{"no":"01","h":"적합한 품질","q":"내 가족이 먹어도 되는가","html":"11/27부터 AI로 만든 가상 전문가가 제품을 권하는 광고는 <b>&lsquo;가상인물&rsquo; 표시를 붙여도 금지</b>입니다. 같은 주 방미심위가 포스파티딜세린·콜라겐·카무트 효소 방송 11건에 &lsquo;주의&rsquo;를 의결했습니다. 품질은 이제 &lsquo;무엇을 넣었나&rsquo;만이 아니라 <b>&lsquo;어떻게 말했나&rsquo;</b>로 증명됩니다."},{"no":"02","h":"적합한 기능","q":"필요한 효능이 분명한가","html":"오늘 신제품의 기능성 언어는 &lsquo;몇 중 복합&rsquo;입니다 — 잇몸탄탄 15중, 슬림웨이 17중, 센트룸 실버 23종. 다만 소비자가 기억하는 것은 하나입니다. <b>잇몸, 다리 부기, 인지력</b>처럼 몸의 한 부위를 가리키는 제품이 이깁니다. 복합은 설명을 늘리는 방식이 아니라 줄이는 방식이어야 합니다."},{"no":"03","h":"적합한 가격","q":"부담 없이 꾸준히 살 수 있는가","html":"다이소가 시니어(기억력·인지력)로 넓어지고, 편의점 건기식 1~3위가 모두 <b>액상+정제 이중제형</b>입니다. 30대 26.1%가 편의점에서 사는 이유는 기능이 아니라 &lsquo;오늘 한 번에 먹는 단위&rsquo;. 재구매는 알 수가 아니라 <b>섭취 장면</b>이 정합니다."}],"quote":"아하핏의 기준은 제 가족에게 적합한 것 — <b>적합한 품질, 적합한 기능, 적합한 가격</b>. 그리고 &lsquo;건강한 삶을 누릴 평등한 기회&rsquo;입니다.","quoteSrc":"ahai.co.kr 아하핏 소개 (2014-10-24)","principle":"<b>제형 불문 원칙.</b> 1정이 늘어난다고 정제로 몰리지 않고, 분말 스틱·액상·이중제형·구미에 같은 잣대를 댑니다. 오늘 확인된 9건만 봐도 정제 4 · 캡슐 2 · 분말 스틱 1 · 액상+정제 1 · 바·생식 2로 흩어져 있습니다."},{"kind":"cards","cols":2,"title":"아하핏 MD 실무 시사점","tag":"해석","desc":"확인된 사실에 대한 해석입니다. 제형에 치우치지 않고, 적합함 세 기준으로 판정했습니다.","items":[{"pill":"기회","pcls":"g","h":"&lsquo;몇 알인가&rsquo;가 가격표보다 먼저 읽히는 구간","html":"잇몸탄탄은 15중 복합을 <b>1일 1정</b>으로, 슬림웨이는 17중 복합을 <b>1일 1포</b>로 묶었습니다. 안국약품 징코도 1정에 9가지 기능성입니다. 복합 기능성이 늘면 원가·서류는 늘지만, 소비자가 보는 것은 &lsquo;하루 몇 알&rsquo;입니다. 아하핏 기준(가족이 부담 없이 꾸준히)에서는 <b>1정·1포 설계</b>가 가격 인상의 근거가 될 수 있습니다.","note":"","fit":"<span class=\"fitchip on\">품질 적합</span><span class=\"fitchip on\">기능 적합</span><span class=\"fitchip on\">가격 적합</span>"},{"pill":"기회","pcls":"g","h":"다이소의 시니어 확장 — 인지력이 3,000~5,000원 라인으로","html":"안국약품이 다이소 전용으로 은행잎 정제와 <b>PS 분말 스틱</b>을 냈습니다. PS 제품은 다이소 최초입니다. 검색에서 포스파티딜세린 12위, 멜라토닌 8위가 이미 대중 키워드이고, 방미심위 제재 11건 중 8건이 포스파티딜세린이었습니다 — <b>수요가 확인된 성분이 저가 채널로 내려오는 첫 사례</b>입니다. 다만 다이소 가격은 미공개라 단가 검증은 다음 회차로.","note":"","fit":"<span class=\"fitchip on\">품질 적합</span><span class=\"fitchip on\">기능 적합</span><span class=\"fitchip mid\">가격 확인</span>"},{"pill":"리스크","pcls":"r","h":"11/27 — AI 가상 전문가 광고 금지가 시작됩니다","html":"흰 가운을 입은 가상 의사가 쇼츠·상세페이지에서 제품을 권하는 연출은 표시를 붙여도 금지입니다. 처분은 1차 영업정지 15일·2차 1개월·3차 2개월, 형사처벌은 5년 이하 징역 또는 5,000만원. <b>광고대행사도 위반 주체</b>가 될 수 있고(양벌규정), 제작 계약서에 AI 인물 고지·게시 전 검수 조항을 두는 것이 현실적 대비입니다. AI 색보정·단순 편집은 제외, 전문가가 아닌 가상 모델은 금지 대상이 아닙니다.","note":"","fit":"<span class=\"fitchip on\">품질 적합</span><span class=\"fitchip on\">기능 적합</span><span class=\"fitchip on\">가격 적합</span>"},{"pill":"체크","pcls":"i","h":"크레아틴은 새 제형보다 &lsquo;분말 대중화&rsquo;가 먼저","html":"쿠팡 판매량 8위에 뉴트리코스트 크레아틴 분말 300g(20,900원, 리뷰 2.3만)이 올라왔습니다. 국내에서 크레아틴은 아직 구미·젤리보다 <b>분말이 주류</b>입니다. 새 제형을 검토한다면 분말 대비 <b>1회 단가</b>와 &lsquo;물 없이 먹는 장면&rsquo;이 설득 근거가 되어야 합니다. 해외에서는 크레아틴이 이미 일반 소비자 카테고리로 넘어왔다는 보도가 나왔습니다(NutraIngredients 11/24).","note":"","fit":"<span class=\"fitchip on\">품질 적합</span><span class=\"fitchip mid\">기능 보통</span><span class=\"fitchip mid\">가격 확인</span>"}]},{"kind":"history","title":"누적 추이 (히스토리 비교)","tag":"일일 누적","desc":"2일차부터 KPI 변화와 검색어·상품 순위 변동이 자동 표시됩니다."},{"kind":"list","title":"이번 회차에서 확인하지 못한 것","items":["<b>신제품 가격</b> — 뉴온·안국약품·보고신약·플러스엑스팜 제품의 소비자가는 보도자료에 없습니다. 홈쇼핑·약국 채널 판매가라 별도 확인이 필요합니다(지어내지 않았습니다).","<b>아이허브 주간 순위 변동</b> — 이번 회차에서는 재조회하지 않았습니다. 전회와 같은 이유로 <code>/best-sellers</code> 경로가 없습니다.","<b>제형별 국내 시장 규모</b> — 여전히 미확인. 제형 순위를 수치로 만들지 않았습니다.","<b>인스타그램·틱톡 국내 해시태그 실측</b> — 이번에도 직접 수집하지 못했습니다. 대 ":"https://ffhub.kr/posts/ai-virtual-expert-food-ad-ban-2026/","srcText":"Functional Food Hub 2026-11-24"},{"date":"2026-12-10 · 시행","tone":"proc","h":"의료기기 광고에도 같은 규제 적용","html":"건기식과 의료기기를 함께 다루는 회사는 두 시행일을 따로 챙겨야 합니다.","srcHref":"","srcText":""},{"date":"2026-12-23 · 의견마감","tone":"proc","h":"공고 제2026-513호 의견 제출 마감","html":"배합표를 이미 설계한 제품은 이 기한 전에 의견을 내야 합니다. 확정되면 2028년부터 간 주의 원료 혼합이 전면 금지됩니다.","srcHref":"https://ffhub.kr/posts/liver-caution-ingredients-mixing-ban-draft-2026/","srcText":"Functional Food Hub 2026-11-25"}]},{"kind":"cards","cols":2,"title":"AI 가상 전문가 광고 — 실무 체크","tag":"11/27 시행","desc":"보도·법령 해설을 바탕으로 정리했습니다. 최종 판단은 자율심의·전문가 확인이 필요합니다.","items":[{"pill":"금지","pcls":"r","h":"세 조건이 모두 맞으면 금지","html":"<p class=\"list-tight\">① AI로 생성한, 실제와 구분하기 어려운 가상의 음향·이미지·영상</p><p class=\"list-tight\" style=\"margin-top:6px\">② 의사·치과의사·한의사·약사·교수 등 전문가의 등장</p><p class=\"list-tight\" style=\"margin-top:6px\">③ 그 전문가가 제품을 보증·추천·지도하거나 직접 사용하는 것으로 오인될 우려</p><p class=\"note\" style=\"margin-top:8px\">AI 색보정·단순 편집은 제외. 전문가가 아닌 가상 모델은 이 조항의 대상이 아니지만 공정위 지침상 &lsquo;가상인물&rsquo; 표시 의무는 남습니다.</p>","note":"","fit":""},{"pill":"처분","pcls":"","h":"행정처분과 형사처벌이 함께","html":"<div class=\"kv\"><span class=\"k\">1차 위반</span><span class=\"v\">영업정지 15일</span></div><div class=\"kv\"><span class=\"k\">2차 / 3차</span><span class=\"v\">1개월 / 2개월</span></div><div class=\"kv\"><span class=\"k\">형사처벌</span><span class=\"v\">5년 이하 징역 또는 5,000만원</span></div><p class=\"note\" style=\"margin-top:8px\">광고를 만든 대행사도 &lsquo;누구든지&rsquo; 조문의 적용 대상입니다. 제작 계약서에 AI 생성 인물 고지 조항과 게시 전 검수 절차를 두는 것이 대비입니다.</p>","note":"","fit":""},{"pill":"사례","pcls":"i","h":"이미 처벌된 사례 — 역노화 일반식품","html":"2026-06-10 식약처는 AI로 만든 가상의 중년 의사가 비타민C·효모식품(일반식품)을 &lsquo;역노화&rsquo;로 권하게 한 업체를 검찰에 송치했습니다. 2025-09~2026-05 약 <b>65만 개</b> 판매, 매출 약 <b>81억원</b>. 건강기능식품이 아닌 일반식품이었다는 점이 핵심입니다.","note":"","fit":""},{"pill":"실무","pcls":"i","h":"우리 쪽에서 먼저 볼 것","html":"<p class=\"list-tight\">· 쇼츠·상세페이지에 흰 가운·청진기·병원 배경 연출이 있는가</p><p class=\"list-tight\" style=\"margin-top:6px\">· 섭취 전후 비교(체중·피부·근육) 연출이 있는가</p><p class=\"list-tight\" style=\"margin-top:6px\">· AI 아바타가 전문가 어투로 효능을 말하는가</p><p class=\"note\" style=\"margin-top:8px\">건기식은 포장 표시를 그대로 옮기는 경우를 빼면 표시·광고 전에 자율심의를 받아야 합니다.</p>","note":"","fit":""}]},{"kind":"kvcards","cols":2,"title":"공고 제2026-513호 — 배합표에서 먼저 볼 것","tag":"10/23 예고 · 의견 12/23","desc":"확정되면 2028-01-01 시행(안)입니다. 지금 설계 중인 복합 제품에 직접 영향이 있습니다.","items":[{"title":"무엇이 바뀌나","cap":"","rows":[{"k":"공통제조기준 신설","v":"&lsquo;간 질환&rsquo; 주의 원료 혼합 금지"},{"k":"기타원료 사용기준","v":"기능성 원료를 기타원료로 쓸 때 일일섭취량의 30% 미만"},{"k":"녹차추출물","v":"주의사항 개정·카테킨·카페인 동시분석법"},{"k":"상어간유(알콕시글리세롤)","v":"섭취 시 주의사항 신설"},{"k":"테아닌","v":"섭취 회피 대상에 영·유아·어린이 추가"},{"k":"의견 제출","v":"2026-12-23까지"}]},{"html":"<div class=\"big-line\">복합 제품이 문제가 된 이유는 <em>숫자</em>입니다.<br>2020~2024년 품목제조신고 29,852건 중 복합이 7,265건(24.3%). 국내 제품은 <b>35.2%</b>, 수입은 6.0% — 한 제품에 기능성 원료가 2개에서 <b>최대 11개</b>까지 들어갑니다.</div><p class=\"note\" style=\"margin-top:12px\">간 손상 사례 5건 중 4건이 가르시니아와 녹차추출물을 함께 먹은 경우였습니다. 다만 2024년 재평가 보고서는 특정 성분을 원인으로 단정할 수 없다고 적었습니다.</p><p class=\"note\" style=\"margin-top:8px\">오늘 신제품의 &lsquo;15중·17중 복합&rsquo;은 성분 수가 아니라 기능성 수입니다. 그래도 배합 설계표에서는 <b>간 주의 원료 포함 여부</b>를 맨 위에 두고 봐야 합니다.</p>","style":"display:flex;flex-direction:column;justify-content:center"}]},{"kind":"bars","title":"11월 3주 품목제조신고 — 많이 쓰인 기능성 원료","tag":"11/16~20 · 137건","desc":"신고 건수 기준 사용 횟수입니다. 마그네슘이 1위라는 점이 검색 2~3위(젖산마그네슘·마그네슘)와 겹칩니다.","items":[{"label":"마그네슘","small":"검색 2·3위","val":"29","w":100,"tone":"","valSub":"건"},{"label":"아연","small":"","val":"27","w":93,"tone":"indigo","valSub":"건"},{"label":"비타민 B1","small":"","val":"24","w":83,"tone":"sky","valSub":"건"},{"label":"프로바이오틱스","small":"체지방 감소 균주 신고 4건","val":"17","w":59,"tone":"amber","valSub":"건"},{"label":"셀레늄","small":"","val":"16","w":55,"tone":"amber","valSub":"건"},{"label":"비타민 D","small":"검색 10위","val":"15","w":52,"tone":"amber","valSub":"건"},{"label":"비타민 C","small":"검색 4위 · 3,000mg 제품 5건","val":"15","w":52,"tone":"amber","valSub":"건"}],"note":"개별인정형 원료를 쓴 제품은 15건, 그중 4건이 체지방 감소 유산균입니다. 가자추출물은 2026-08-12 제203차 심의위에서 다리 부기 완화가 추가 인정돼 &lsquo;레그케어 가자&rsquo;로 신고됐습니다."},{"kind":"cards","cols":2,"title":"채널 — 편의점 건기식의 주인은 30대 직장인","tag":"서울경제 2026-11-25","items":[{"pill":"GS25","pcls":"g","h":"분기마다 가속 — 15.2%","html":"<div class=\"kv\"><span class=\"k\">1분기</span><span class=\"v\">+3.0%</span></div><div class=\"kv\"><span class=\"k\">2분기</span><span class=\"v\">+7.5%</span></div><div class=\"kv\"><span class=\"k\">3분기</span><span class=\"v\">+15.2%</span></div><p class=\"note\" style=\"margin-top:8px\">오피스 상권만 보면 7.0% → 11.4% → <b>21.2%</b>. 품목은 30여 종에서 40여 종으로, 일본 젤리형 &lsquo;UHA 미카쿠토 구미서플리&rsquo;를 단독 수입했습니다.</p>","note":"","fit":""},{"pill":"연령","pcls":"g","h":"30대 26.1%가 1위","html":"<div class=\"kv\"><span class=\"k\">30대</span><span class=\"v\">26.1%</span></div><div class=\"kv\"><span class=\"k\">40대</span><span class=\"v\">25.5%</span></div><div class=\"kv\"><span class=\"k\">10~20대</span><span class=\"v\">21.7%</span></div><div class=\"kv\"><span class=\"k\">50대 / 60대+</span><span class=\"v\">19.5% / 7.2%</span></div><p class=\"note\" style=\"margin-top:8px\">전체 시장(협회)은 50대 28.0%·60대 24.8%·30대 13.2%. <b>편의점이 다른 연령을 데려오고 있습니다.</b></p>","note":"","fit":""},{"pill":"제형","pcls":"i","h":"이중제형이 1~3위","html":"GS25 상반기 건기식 매출 1~3위가 모두 <b>액상+정제 이중제형</b>이었습니다. 보고신약의 듀얼캡(50mL+2정)과 KGC 아이패스 에너지샷이 같은 방향입니다.","note":"","fit":""},{"pill":"품목","pcls":"i","h":"30~40대는 밀크시슬·블랙마카","html":"30~40대에서는 피로 개선을 내세운 밀크시슬·블랙마카가 많이 팔렸고, 20대 남성은 밀크시슬, 20대 여성·30대는 비타민이 1위였습니다(서울경제). 세븐일레븐 3분기 +23%, 오피스 +30%, 오피스 매출의 절반이 2030.","note":"","fit":""}]},{"kind":"cards","cols":3,"title":"기업·수출 동향","tag":"11/24~26","items":[{"pill":"","pcls":"","h":"콜마비앤에이치 → 영국 부츠","html":"<div class=\"kv\"><span class=\"k\">공급</span><span class=\"v\">PB 웰니스 16종</span></div><div class=\"kv\"><span class=\"k\">1~9월 수출</span><span class=\"v\">882억 (+14.2%)</span></div><div class=\"kv\"><span class=\"k\">최대 고객사 비중</span><span class=\"v\">72.3% → 57.3%</span></div><p class=\"note\" style=\"margin-top:8px\">서울 블룸 5·용산 웰빙 6·HABI x K-Wellness 5종. 홍삼은 샷으로, 콜라겐은 과일 맛 스틱 젤리로. 부츠 온라인몰 &lsquo;웰니스&rsquo; 검색 1년간 200%↑.</p>","note":"","fit":""},{"pill":"","pcls":"","h":"현대바이오랜드 — 유통사업 종료","html":"<div class=\"kv\"><span class=\"k\">종료 예정</span><span class=\"v\">2026-12-31</span></div><div class=\"kv\"><span class=\"k\">해당 매출(2025)</span><span class=\"v\">313억6,606만원</span></div><div class=\"kv\"><span class=\"k\">연결매출 비중</span><span class=\"v\">24.03%</span></div><p class=\"note\" style=\"margin-top:8px\">네슬레 헬스사이언스가 한국 직진출로 사업모델을 바꾸면서 파트너십이 종료됐습니다. 솔가·바이탈프로틴스·GO헬시 등 프리미엄 직수입 라인의 <b>국내 유통 주체가 바뀝니다</b>.</p>","note":"","fit":""},{"pill":"","pcls":"","h":"국산 원료 — 수국잎 삼중 기능성","html":"<div class=\"kv\"><span class=\"k\">기능성</span><span class=\"v\">피부보습·체지방·모발</span></div><div class=\"kv\"><span class=\"k\">미국</span><span class=\"v\">FDA NDI 등재(2024-06)</span></div><div class=\"kv\"><span class=\"k\">사업화</span><span class=\"v\">ODM 14종 · 누적 65.5억</span></div><p class=\"note\" style=\"margin-top:8px\">코스맥스바이오. 인체시험 12주 피부 수분 증가 3.2배, 체지방 0.99kg·체중 1.75kg 감소. 국내산 원료 최초 삼중 기능성 개별인정형.</p>","note":"","fit":""},{"pill":"","pcls":"","h":"브랜드평판 11월 — 고려은단 1위","html":"<div class=\"kv\"><span class=\"k\">1위</span><span class=\"v\">고려은단 2,215,802</span></div><div class=\"kv\"><span class=\"k\">2위</span><span class=\"v\">유한양행 1,970,301</span></div><div class=\"kv\"><span class=\"k\">3위</span><span class=\"v\">LG생활건강 1,869,484</span></div><p class=\"note\" style=\"margin-top:8px\">4위 KT&amp;G, 5위 일동제약. 전체 빅데이터는 2,597만3,509건으로 전월 대비 13.90% 줄었지만 상위 3사 지수는 모두 올랐습니다(소통지수 급등).</p>","note":"","fit":""},{"pill":"","pcls":"","h":"HEM파마 — 수출 +108%","html":"<div class=\"kv\"><span class=\"k\">3분기 수출</span><span class=\"v\">47.9억 (+108%)</span></div><div class=\"kv\"><span class=\"k\">3분기 매출</span><span class=\"v\">109억 (+269%)</span></div><div class=\"kv\"><span class=\"k\">영업손실</span><span class=\"v\">10.5억 (축소)</span></div><p class=\"note\" style=\"margin-top:8px\">암웨이 글로벌 판매망향 프로바이오틱스 OEM 첫 매출. 일본 &lsquo;마이랩&rsquo; 서비스도 반영.</p>","note":"","fit":""},{"pill":"","pcls":"","h":"해외 — Haleon APAC R&amp;D 8,000만 달러","html":"Haleon이 아시아태평양 연구·혁신에 <b>8,000만 달러 이상</b>을 투자한다고 밝혔습니다(11/25). 국내 시장이 0.7% 역성장하는 동안 글로벌 대형사는 아시아 R&amp;D에 자본을 넣는 중입니다.","note":"","fit":""}]},{"kind":"cards","cols":2,"title":"해외 시그널 — NutraIngredients 11/24~25","tag":"글로벌","items":[{"pill":"스포츠뉴트리션","pcls":"i","h":"&lsquo;경계가 사라진다&rsquo; — 크레아틴·수분 보충의 대중화","html":"런던 Sports &amp; Active Nutrition Summit(11/9)에서 나온 진단: 고단백 클레임 제품이 2013→2024년 <b>4배</b>(Mintel). 크레아틴·수분 보충이 선수 전유물에서 일반 소비자로 넘어왔습니다. GLP-1 복용자 <b>10명 중 6명</b>이 보충제 지출을 늘렸고, 주로 단백질·멀티비타민·섬유·프로바이오틱스입니다(Lumina).","note":"","fit":""},{"pill":"롱제비티","pcls":"i","h":"25~34세가 노화를 먼저 산다","html":"보충제가 노화에 역할이 있다고 답한 비율이 <b>25~34세 20%</b> vs 65세 이상 12%. 약 36%가 노화 대응 보충제를 이미 먹고 있고, 망설이는 첫 이유는 &lsquo;근거가 부족하다&rsquo;였습니다. 프리미엄 클레임보다 <b>증명</b>이 병목입니다.","note":"","fit":""},{"pill":"채널","pcls":"i","h":"보충제가 의사 클리닉으로 들어간다","html":"Tonum Health가 의사 주도 롱제비티 플랫폼 Euvita Health와 제휴. GLP-1 복용자의 근육 유지용 24g 단백질바 등 기능성 식품까지 확장. 의료인의 <b>92%</b>가 비타민·보충제를 권하고, 90%는 환자가 자주 조언을 구한다고 답했습니다(Sermo).","note":"","fit":""},{"pill":"라벨","pcls":"i","h":"캘리포니아, 보충제 날짜표시 의무 면제","html":"AB 2779가 식이보충제를 AB 660의 표준 날짜표시 의무에서 제외했습니다. 다만 &lsquo;일반식품과 보충제 사이&rsquo; 제품은 소송 리스크가 남습니다 — 국내에서 구미·젤리·바를 일반식품으로 파는 구조와 같은 고민입니다.","note":"","fit":""}]},{"kind":"html","title":"원문 링크","html":"<div class=\"card\"><p class=\"srcs\"><a href=\"https://www.newsis.com/view/NISX20261126_0003883819\" target=\"_blank\" rel=\"noopener\">&ldquo;AI로 만든 가짜의사 광고 안돼&rdquo;…내일부터 금지 (뉴시스 2026-11-26)</a><br><a href=\"https://ffhub.kr/posts/ai-virtual-expert-food-ad-ban-2026/\" target=\"_blank\" rel=\"noopener\">AI 가짜 의사 광고 금지: 11월 27일부터 건강기능식품 회사가 점검할 것 (FFH 2026-11-24)</a><br><a href=\"https://www.thekoreahealthnews.com/news/view.php?bIdx=14236\" target=\"_blank\" rel=\"noopener\">치매 예방한다더니…건기식 효능 부풀린 방송 11건 제재 (2026-11-24)</a><br><a href=\"htt <script>
(function () {

  var VIEWS = [

    { id: "newproducts", label: "신제품" },

    { id: "rank", label: "네이버 · 쿠팡 랭킹" }
  ];
  var PERIODS = ["daily", "weekly", "monthly"];
  var WK = ["일", "월", "화", "수", "목", "금", "토"];
  var EXPECT = {
    weekly: { first: "2026-11-30", note: "매주 월요일" },
    monthly: { first: "2026-12-01", note: "매월 1일" }
  };

  var state = {
    period: "daily",
    date: null,
    view: "summary",
    manifest: (EMB.manifest && EMB.manifest.daily) ? EMB.manifest : { daily: [], weekly: [], monthly: [] },
    all: {},          // date/key -> report (fetched; embedded JSON only as file:// fallback)
    current: null,
    offline: false
  };

  function $(id) { return document.getElementById(id); }
  function weekdayOf(dstr) {
    var d = new Date(dstr + "T00:00:00+09:00");
    if (isNaN(d.getTime())) return "";
    return WK[d.getDay()];
  }
  function fmtDate(dstr) { return dstr + " (" + weekdayOf(dstr) + ")"; }
  function addDays(dstr, n) {
    var d = new Date(dstr + "T00:00:00+09:00");
    d.setDate(d.getDate() + n);
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function listFor(period) {
    var arr = (state.manifest && state.manifest[period]) ? state.manifest[period].slice() : [];
    return arr.sort();
  }
  function latestDate(period) {
    var l = listFor(period);
    return l.length ? l[l.length - 1] : null;
  }
  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function reportPath(period, key) {
    if (period === "daily") return "./data/daily/" + key + ".json";
    if (period === "weekly") return "./data/weekly/" + key + ".json";
    return "./data/monthly/" + key + ".json";
  }
  function cacheKey(period, key) { return period + "|" + key; }
  function getReport(period, key) {
    return key ? state.all[cacheKey(period, key)] : undefined;
  }
  function loadReport(period, key) {
    if (!key) return Promise.resolve(null);
    var ck = cacheKey(period, key);
    if (state.all[ck]) return Promise.resolve(state.all[ck]);
    return fetchJSON(reportPath(period, key)).then(function (d) {
      state.all[ck] = d;
      return d;
    }).catch(function () {
      // 내장 JSON은 일일 리포트의 file:// 대체용으로만 쓴다.
      if (period === "daily" && EMB.reports && EMB.reports[key]) {
        state.all[ck] = EMB.reports[key];
        return state.all[ck];
      }
      return null;
    });
  }

  /* ---------------- header / footer ---------------- */
  function renderHeader(rep) {
    if (!rep || !rep.header) return;
    var h = rep.header;
    $("eyebrow").innerHTML = '<span class="dot"></span>' + h.eyebrow;

    $("lede").innerHTML = h.lede;
    $("badges").innerHTML = (h.badges || []).map(function (b) {
      return '<span class="badge' + (b.tone === "strong" ? " strong" : "") + '"><strong>' + b.text + "</strong>" +
        (b.sub ? "<small>" + b.sub + "</small>" : "") + "</span>";
    }).join("");
    document.title = "건강기능식품 시장 트렌드 대시보드 (" + rep.date + ")";
  }
  function renderFooter(rep) {
    var f = (rep && rep.footer) || {};
    $("footSources").innerHTML = (f.sources || []).map(function (s) { return "<li>" + s + "</li>"; }).join("");
    $("footAbout").innerHTML = f.about || "";
    $("footNext").innerHTML = f.next || "";
  }

  /* ---------------- report bar ---------------- */
  function renderBar() {
    document.querySelectorAll(".periods button").forEach(function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-period") === state.period ? "true" : "false");

    var dates = listFor(state.period);

    if (!dates.length) {
      sel.innerHTML = '<option value="">데이터 없음</option>';
      sel.disabled = true;
    } else {
      sel.disabled = false;
      sel.innerHTML = dates.slice().reverse().map(function (d) {
        var label = state.period === "daily"
          ? fmtDate(d) + (d === dates[dates.length - 1] ? " · 최신" : "")
          : d;
        return '<option value="' + d + '"' + (d === state.date ? " selected" : "") + ">" + label + "</option>";
      }).join("");
    }
    var idx = dates.indexOf(state.date);
    $("prevBtn").disabled = idx <= 0;
    $("nextBtn").disabled = idx < 0 || idx >= dates.length - 1;

    var dCount = listFor("daily").length, wCount = listFor("weekly").length, mCount = listFor("monthly").length;
    var latest = latestDate("daily");
    var meta = "누적 <b>일일 " + dCount + "일</b> · 주간 " + wCount + "건 · 월간 " + mCount + "건";
    if (latest) meta += " · 최근 갱신 " + latest;
    if (state.offline) meta += " · 오프라인(내장 데이터)";
    $("reportMeta").innerHTML = meta;
  }

  function renderViewTabs(show) {
    $("viewBar").hidden = !show;
    if (!show) return;
    $("viewTabs").innerHTML = VIEWS.map(function (v) {
      return '<button type="button" role="tab" data-view="' + v.id + '" aria-selected="' +
        (v.id === state.view ? "true" : "false") + '">' + v.label + "</button>";
    }).join("");
  }

  /* ---------------- blocks ---------------- */
  function head(b) {
    if (!b.title) return "";
    return '<div class="block-head"><h2>' + b.title + (b.tag ? ' <span class="tag">' + b.tag + "</span>" : "") + "</h2>" +
      (b.desc ? "<p>" + b.desc + "</p>" : "") + "</div>";
  }
  function wrapBlock(b, body) {
    return '<div class="block">' + head(b) + body + "</div>";
  }

  function blockKpis(b) {

  }

  function blockHeadlines(b) {

  }

  function blockStrip(b) {
    return '<div class="strip">' + b.cells.map(function (c) {

  }

  function blockFitlens(b) {
    return '<div class="grid g3">' + b.criteria.map(function (c) {

    }).join("") + "</div>" +
      '<div class="card fitquote"><p class="q">&ldquo;' + b.quote + "&rdquo;</p>" +
      '<p class="qs">— ' + b.quoteSrc + "</p>" +
      '<div class="callout pr">' + b.principle + "</div></div>";
  }

  function blockCards(b) {
    return '<div class="grid g' + (b.cols || 2) + '">' + b.items.map(function (c) {
      var h = (c.pill ? '<span class="pill ' + (c.pcls || "") + '">' + c.pill + "</span>" : "") + (c.h || "");
      return '<div class="card">' + (h ? "<h3>" + h + "</h3>" : "") +

        (c.fit ? '<div class="fitline">' + c.fit + "</div>" : "") +

        "</div>";
    }).join("") + "</div>";
  }

  function barsHTML(items) {
    return '<div class="bars">' + items.map(function (x) {
      return '<div class="bar"><div class="lbl">' + x.label + (x.small ? "<small>" + x.small + "</small>" : "") + "</div>" +
        '<div class="track"><div class="fill ' + (x.tone || "") + '" style="width:' + x.w + '%"></div></div>' +
        '<div class="val">' + x.val + (x.valSub ? "<small>" + x.valSub + "</small>" : "") + "</div></div>";
    }).join("") + "</div>";
  }
  function blockBars(b) {
    return '<div class="card pad-lg">' + barsHTML(b.items) +
      (b.note ? '<p class="note" style="margin-top:14px">' + b.note + "</p>" : "") + "</div>";
  }
  function blockBargrid(b) {
    return '<div class="grid g' + (b.cols || 2) + '">' + b.groups.map(function (g) {
      return '<div class="card">' + (g.title ? "<h3>" + g.title + "</h3>" : "") +
        (g.cap ? '<p class="cap">' + g.cap + "</p>" : "") +
        '<div style="margin-top:6px">' + barsHTML(g.items) + "</div>" +
        (g.note ? '<p class="note" style="margin-top:12px">' + g.note + "</p>" : "") + "</div>";
    }).join("") + "</div>";
  }

  function blockKvcards(b) {
    return '<div class="grid g' + (b.cols || 2) + '">' + b.items.map(function (c) {
      var inner = "";
      if (c.title) inner += "<h3>" + c.title + "</h3>";
      if (c.cap) inner += '<p class="cap">' + c.cap + "</p>";
      if (c.rows) inner += c.rows.map(function (r) {
        return '<div class="kv"><span class="k">' + r.k + '</span><span class="v">' + r.v + "</span></div>";
      }).join("");
      if (c.html) inner += c.html;
      return '<div class="card"' + (c.style ? ' style="' + c.style + '"' : "") + ">" + inner + "</div>";
    }).join("") + "</div>";
  }

  function blockTimeline(b) {
    return '<div class="card pad-lg"><ul class="tl">' + b.items.map(function (t) {
      return '<li class="' + (t.tone || "") + '"><span class="d">' + t.date + "</span>" +
        "<h4>" + t.h + "</h4><p>" + t.html + "</p>" +
        (t.srcHref ? '<a class="src" href="' + t.srcHref + '" target="_blank" rel="noopener">' + t.srcText + "</a>" : "") +
        "</li>";
    }).join("") + "</ul></div>";
  }

  function blockList(b) {
    return '<div class="card"><ul class="list-tight">' + b.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul></div>";
  }

  function blockDonuts(b) {
    return '<div class="grid g' + (b.cols || 2) + '">' + b.items.map(function (d) {
      var c0 = d.legend[0][2];
      return '<div class="card"><h3>' + d.title + "</h3>" + (d.cap ? '<p class="cap">' + d.cap + "</p>" : "") +
        '<div class="donut-row"><div class="donut" style="background:conic-gradient(' + c0 + " 0 " + d.percent + "%, #cbd5e1 " + d.percent + '% 100%)">' +
        '<div class="dv">' + d.big + "<small>" + d.label + "</small></div></div>" +
        '<div class="legend">' + d.legend.map(function (l) {
          return '<div><i style="background:' + l[2] + '"></i>' + l[0] + "<b>" + l[1] + "</b></div>";
        }).join("") + "</div></div></div>";
    }).join("") + "</div>";
  }

  function blockAgecols(b) {
    var max = Math.max.apply(null, b.items.map(function (x) { return x.n; })) || 1;
    return '<div class="card">' + (b.desc ? '<p class="cap">' + b.desc + "</p>" : "") +
      '<div class="cols">' + b.items.map(function (x) {
        var h = Math.max(3, Math.round(x.n / max * 150));
        var cls = x.n === max ? " top" : (x.n >= 30 ? " mid" : "");
        return '<div class="col"><div class="cval">' + x.val + '</div><div class="cbar' + cls + '" style="height:' + h + 'px"></div>' +
          '<div class="cname">' + x.name + "</div></div>";
      }).join("") + "</div>" +
      (b.callout ? '<div class="callout info" style="margin-top:14px">' + b.callout + "</div>" : "") + "</div>";
  }

  function blockKeywords(b) {
    return '<div class="card"><div class="search">' +
      '<input type="text" id="kwSearch" placeholder="키워드 검색 (예: 마그네슘, 베르베린)" aria-label="인기검색어 필터">' +
      '<label class="chk"><input type="checkbox" id="kwOnlyKey">핵심 키워드만</label>' +
      '<span class="count" id="kwCount"></span></div>' +
      '<div class="kws" id="kwList">' + b.items.map(function (k) {
        return '<div class="kw' + (k.key ? " key" : "") + '" data-kw="' + k.k + '" data-key="' + k.key + '">' +
          '<span class="r">' + k.r + '</span><span class="k">' + k.k + "</span>" +
          (k.tag ? '<span class="tag">' + k.tag + "</span>" : "") + "</div>";
      }).join("") + "</div>" +
      (b.note ? '<p class="note" style="margin-top:12px">' + b.note + "</p>" : "") + "</div>";
  }

  function blockRanktables(b) {
    return '<div class="card"><div class="search">' +
      '<input type="text" id="rkSearch" placeholder="상품·브랜드 검색 (예: 마그네슘, 락토핏, 오메가3)" aria-label="랭킹 통합 필터">' +
      '<label class="chk"><input type="radio" name="chan" value="all" checked>전체</label>' +
      '<label class="chk"><input type="radio" name="chan" value="naver">네이버+</label>' +
      '<label class="chk"><input type="radio" name="chan" value="coupang">쿠팡</label>' +
      '<span class="count" id="rkCount"></span></div>' +
      b.tables.map(function (t) {
        return '<div id="' + t.id + '" data-chtbl="' + t.ch + '" style="margin-bottom:18px">' +
          "<h3 style='margin-bottom:2px'>" + t.title + "</h3>" +
          '<p class="cap">' + t.cap + "</p>" +
          '<div class="tblwrap"><table><thead><tr><th style="width:56px">순위</th><th>상품</th>' +
          '<th class="num">가격</th><th class="num">리뷰</th><th>메모</th></tr></thead><tbody>' +
          t.rows.map(function (r) {
            return '<tr data-ch="' + t.ch + '"><td><span class="rank' + (r.rank <= 3 ? " top3" : "") + '">' + r.rank + "</span></td>" +
              '<td class="nm">' + r.name + (r.sub ? '<span class="sub">' + r.sub + "</span>" : "") + "</td>" +
              '<td class="num">' + r.price + '</td><td class="num">' + r.rev + "</td><td>" + r.memo + "</td></tr>";
          }).join("") + "</tbody></table></div></div>";
      }).join("") +
      '<p class="note" id="rkEmpty" style="padding:14px 2px 2px" hidden>조건에 맞는 상품이 없습니다. 검색어를 지우거나 채널을 &lsquo;전체&rsquo;로 바꿔 보세요.</p>' +
      (b.note ? '<p class="note" style="margin-top:12px">' + b.note + "</p>" : "") + "</div>";
  }

  /* ---------------- history ---------------- */
  function spark(vals) {
    if (!vals || vals.length < 2) return "";
    var w = 260, h = 60, pad = 8;
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var pts = vals.map(function (v, i) {
      var x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      var y = h - pad - ((v - min) / span) * (h - pad * 2);
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    });
    var line = pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ");
    var dots = pts.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="#0d9488"/>'; }).join("");
    return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="추이 그래프">' +
      '<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="#e2e8f0" stroke-width="1"/>' +
      '<polyline fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="' + line + '"/>' +
      dots + "</svg>";
  }

  function pctDelta(cur, prev, digits) {
    if (prev === undefined || prev === null || prev === 0) return null;
    var d = (cur - prev) / Math.abs(prev) * 100;
    return (d > 0 ? "+" : "") + d.toFixed(digits === undefined ? 1 : digits) + "%";
  }

  var KPI_ROWS = [
    { key: "purchaseRate", label: "구매경험률", unit: "%" },
    { key: "marketEok", label: "시장 규모", unit: "억원" },
    { key: "householdsMan", label: "구매가구", unit: "만" },
    { key: "onlineShare", label: "인터넷몰 구매 비중", unit: "%" },
    { key: "smallPackIntent", label: "소용량 시도 의향", unit: "%" },
    { key: "exportEok", label: "건기식 수출", unit: "억원" }
  ];

  function renderHistory(block) {
    var dates = listFor("daily");
    var reps = dates.map(function (d) { return getReport("daily", d); }).filter(Boolean);
    var activeDate = state.date;

    if (reps.length < 2) {
      return wrapBlock(block,
        '<div class="card pad-lg"><div class="hist-empty"><div class="hist-badge">1일차</div>' +
        '<p class="big-line">1일차 기준 데이터 저장 완료 — 내일부터 전일 대비 순위 변동과 추이가 누적됩니다</p></div>' +
        '<p class="note" style="margin-top:12px">이 리포트는 <code>data/daily/' + (reps[0] ? reps[0].date : "2026-11-25") +
        '.json</code>으로 저장되었습니다. 다음 일일 리포트가 <code>data/manifest.json</code>의 daily 목록에 추가되면 ' +
        "이 영역에 KPI 추이·검색어 순위 변동·상품 순위 변동이 자동으로 표시됩니다.</p>" +
        datesChips(dates, activeDate) + "</div>");
    }

    var prev = reps[reps.length - 2], cur = reps[reps.length - 1];
    var kpiRows = KPI_ROWS.map(function (r) {
      var c = cur.trend && cur.trend.kpi ? cur.trend.kpi[r.key] : null;
      var p = prev.trend && prev.trend.kpi ? prev.trend.kpi[r.key] : null;
      if (c === undefined || c === null) return "";
      var dHtml = '<span class="d flat">—</span>';
      if (p !== undefined && p !== null && p !== 0) {
        var diff = c - p;
        var cls = diff > 0 ? "up" : (diff < 0 ? "down" : "flat");
        var sign = diff > 0 ? "▲" : (diff < 0 ? "▼" : "–");
        var abs = Math.abs(diff);
        var txt = r.unit === "%" ? abs.toFixed(1) + "p"
          : abs.toLocaleString("ko-KR", { maximumFractionDigits: 1 });
        dHtml = '<span class="d ' + cls + '">' + sign + " " + txt + "</span>";
      }
      var cTxt = (typeof c === "number") ? c.toLocaleString("ko-KR", { maximumFractionDigits: 1 }) : c;
      return '<div class="hist-kpi"><span class="nm">' + r.label + '</span><span class="v">' + cTxt +
        '<small style="color:#94a3b8;font-weight:600">' + r.unit + "</small></span>" + dHtml + "</div>";
    }).join("");

    var series = reps.map(function (r) { return r.trend && r.trend.kpi ? r.trend.kpi.purchaseRate : null; }).filter(function (v) { return v !== null; });

    var prevKw = {};
    ((prev.trend && prev.trend.keywords) || []).forEach(function (x) { prevKw[x.k] = x.r; });
    var movers = ((cur.trend && cur.trend.keywords) || []).map(function (x) {
      var p = prevKw[x.k];
      if (p === undefined) return { k: x.k, r: x.r, tag: "new" };
      if (p === x.r) return null;
      return { k: x.k, r: x.r, d: p - x.r };
    }).filter(Boolean).sort(function (a, b) {
      if (a.tag === "new") return -1;
      if (b.tag === "new") return 1;
      return Math.abs(b.d) - Math.abs(a.d);
    }).slice(0, 10);

    var moverHtml = movers.length ? movers.map(function (m) {
      var badge = m.tag === "new" ? '<span class="new">NEW</span>'
        : (m.d > 0 ? '<span class="up">▲ ' + m.d + "</span>" : '<span class="down">▼ ' + Math.abs(m.d) + "</span>");
      return '<div class="mv"><span class="r" style="min-width:24px">' + m.r + '</span><span class="nm">' + m.k + "</span>" + badge + "</div>";
    }).join("") : '<p class="note">전일과 비교해 순위 변동이 없습니다.</p>';

    function prodMovers(ch) {
      var pm = {};
      (((prev.trend || {}).products || {})[ch] || []).forEach(function (x) { pm[x.name] = x.r; });
      var out = ((((cur.trend || {}).products || {})[ch]) || []).map(function (x) {
        var p = pm[x.name];
        if (p === undefined) return { name: x.name, r: x.r, tag: "new" };
        if (p === x.r) return null;
        return { name: x.name, r: x.r, d: p - x.r };
      }).filter(Boolean);
      if (!out.length) return '<p class="note">순위 변동 없음(확인된 항목 기준).</p>';
      return out.slice(0, 6).map(function (m) {
        var badge = m.tag === "new" ? '<span class="new">NEW</span>'
          : (m.d > 0 ? '<span class="up">▲ ' + m.d + "</span>" : '<span class="down">▼ ' + Math.abs(m.d) + "</span>");
        return '<div class="mv"><span class="nm">' + m.name + "</span>" + badge + "</div>";
      }).join("");
    }

    return wrapBlock(block,
      '<div class="hist-grid">' +
        '<div class="card"><h3>핵심 지표 추이</h3><p class="cap">' + fmtDate(prev.date) + " → " + fmtDate(cur.date) + " (전일 대비)</p>" +
        kpiRows + '<div style="margin-top:12px">' + spark(series) + "</div></div>" +
        '<div class="card"><h3>검색어 순위 변동</h3><p class="cap">전일 대비 상승·하락 폭 상위</p>' + moverHtml + "</div>" +
      "</div>" +
      '<div class="grid g2" style="margin-top:14px">' +
        '<div class="card"><h3>네이버+ 상품 순위 변동</h3><p class="cap">' + fmtDate(prev.date) + " → " + fmtDate(cur.date) + "</p>" + prodMovers("naver") + "</div>" +
        '<div class="card"><h3>쿠팡 상품 순위 변동</h3><p class="cap">' + fmtDate(prev.date) + " → " + fmtDate(cur.date) + "</p>" + prodMovers("coupang") + "</div>" +
      "</div>" +
      '<div class="card" style="margin-top:14px">' + datesChips(dates, activeDate) + "</div>");
  }

  function datesChips(dates, active) {
    if (!dates.length) return "";
    return '<div class="hist-dates"><span class="lb">저장된 일일 리포트</span>' + dates.map(function (d) {
      return '<button type="button" class="hist-chip' + (d === active ? " on" : "") + '" data-goto="' + d + '">' + fmtDate(d) + "</button>";
    }).join("") + "</div>";
  }

  /* ---------------- dispatch ---------------- */
  function renderBlock(b) {
    switch (b.kind) {
      case "kpis": return wrapBlock(b, blockKpis(b));
      case "headlines": return wrapBlock(b, blockHeadlines(b));
      case "strip": return wrapBlock(b, blockStrip(b));
      case "fitlens": return wrapBlock(b, blockFitlens(b));
      case "cards": return wrapBlock(b, blockCards(b));
      case "bargrid": return wrapBlock(b, blockBargrid(b));
      case "bars": return wrapBlock(b, blockBars(b));
      case "kvcards": return wrapBlock(b, blockKvcards(b));
      case "timeline": return wrapBlock(b, blockTimeline(b));
      case "list": return wrapBlock(b, blockList(b));
      case "donuts": return wrapBlock(b, blockDonuts(b));
      case "agecols": return wrapBlock(b, blockAgecols(b));
      case "keywords": return wrapBlock(b, blockKeywords(b));
      case "ranktables": return wrapBlock(b, blockRanktables(b));
      case "history": return renderHistory(b);
      case "html": return wrapBlock(b, b.html || "");
      default: return "";
    }
  }

  function renderPanel(rep) {
    var views = rep.views || {};
    var viewReset = false;
    if (!views[state.view]) { state.view = "summary"; viewReset = true; }
    if (viewReset) renderViewTabs(true);
    $("reportView").innerHTML = VIEWS.map(function (v) {
      var blocks = views[v.id] || [];
      return '<section class="panel" data-panel="' + v.id + '" role="tabpanel" aria-label="' + v.label + '"' +
        (v.id === state.view ? "" : " hidden") + ">" + blocks.map(renderBlock).join("") + "</section>";
    }).join("");
    bindFilters();
  }

  function renderPeriodHeader(period) {
    var label = period === "weekly" ? "주간 리포트" : "월간 리포트";
    $("eyebrow").innerHTML = '<span class="dot"></span>' + label + " · 누적 대기";
    $("pageTitle").innerHTML = '💊 건강기능식품 시장 트렌드 대시보드 <span style="color:#0f766e">(' + label + ")</span>";
    document.title = "건강기능식품 시장 트렌드 대시보드 (" + label + ")";
  }

  function renderPlaceholder(period) {
    var dCount = listFor("daily").length;
    var label = period === "weekly" ? "주간 리포트" : "월간 리포트";
    var ico = period === "weekly" ? "🗓" : "📅";
    var text = "주간 리포트는 매주 월요일(첫 리포트: 2026-11-30 예정), 월간 리포트는 매월 1일(첫 리포트: 2026-12-01 예정)에 누적 일일 데이터를 바탕으로 자동 생성됩니다";
    var exp = EXPECT[period];
    $("reportView").innerHTML = '<div class="state">' +
      '<div class="ico">' + ico + "</div><h2>" + label + " — 아직 누적된 데이터가 없습니다</h2>" +
      "<p>" + text + ".</p>" +
      '<div class="future"><span>' + (period === "weekly" ? "매주 월요일" : "매월 1일") + " 자동 집계</span>" +
      "<span>첫 리포트 " + exp.first + " 예정</span></div>" +
      '<div class="meta">현재 누적: 일일 ' + dCount + "일 · 주간 " + listFor("weekly").length + "건 · 월간 " + listFor("monthly").length + "건</div>" +
      '<button type="button" class="btn" id="goDaily">최신 일일 리포트 보기</button></div>';
    var btn = $("goDaily");
    if (btn) btn.addEventListener("click", function () { switchPeriod("daily"); });
  }

  /* ---------------- filters ---------------- */
  function bindFilters() {
    var kwSearch = $("kwSearch"), kwOnly = $("kwOnlyKey"), kwCount = $("kwCount");
    var kwItems = Array.prototype.slice.call(document.querySelectorAll("#kwList .kw"));
    function filterKeywords() {
      var q = (kwSearch ? kwSearch.value : "").trim().toLowerCase();
      var onlyKey = kwOnly ? kwOnly.checked : false;
      var shown = 0;
      kwItems.forEach(function (el) {
        var text = (el.getAttribute("data-kw") || "").toLowerCase();
        var isKey = el.getAttribute("data-key") === "1";
        var ok = (q === "" || text.indexOf(q) !== -1) && (!onlyKey || isKey);
        if (ok) { el.removeAttribute("hidden"); shown++; } else { el.setAttribute("hidden", ""); }
      });
      if (kwCount) kwCount.textContent = shown + " / " + kwItems.length + "개 표시";
    }
    if (kwSearch) kwSearch.addEventListener("input", filterKeywords);
    if (kwOnly) kwOnly.addEventListener("change", filterKeywords);
    if (kwItems.length) filterKeywords();

    var rkSearch = $("rkSearch"), rkCount = $("rkCount"), rkEmpty = $("rkEmpty");
    var rows = Array.prototype.slice.call(document.querySelectorAll("tr[data-ch]"));
    var radios = Array.prototype.slice.call(document.querySelectorAll('input[name="chan"]'));
    function visibleRowsIn(box) {
      if (!box) return 0;
      return Array.prototype.filter.call(box.querySelectorAll("tr[data-ch]"), function (tr) { return !tr.hasAttribute("hidden"); }).length;
    }
    function filterRanks() {
      if (!rows.length) return;
      var q = (rkSearch ? rkSearch.value : "").trim().toLowerCase();
      var chan = "all";
      radios.forEach(function (r) { if (r.checked) chan = r.value; });
      var shown = 0;
      rows.forEach(function (tr) {
        var isChan = tr.getAttribute("data-ch") === chan || chan === "all";
        var text = (tr.textContent || "").toLowerCase();
        var ok = isChan && (q === "" || text.indexOf(q) !== -1);
        if (ok) { tr.removeAttribute("hidden"); shown++; } else { tr.setAttribute("hidden", ""); }
      });
      document.querySelectorAll("[data-chtbl]").forEach(function (box) {
        if (visibleRowsIn(box) > 0) box.removeAttribute("hidden"); else box.setAttribute("hidden", "");
      });
      if (rkCount) rkCount.textContent = shown === 0 ? "일치하는 항목 없음" : shown + "개 상품 표시";
      if (rkEmpty) { if (shown === 0) rkEmpty.removeAttribute("hidden"); else rkEmpty.setAttribute("hidden", ""); }
    }
    if (rkSearch) rkSearch.addEventListener("input", filterRanks);
    radios.forEach(function (r) { r.addEventListener("change", filterRanks); });
    if (rows.length) filterRanks();

    document.querySelectorAll(".hist-chip[data-goto]").forEach(function (b) {
      b.addEventListener("click", function () { goDate(b.getAttribute("data-goto")); });
    });
  }

  /* ---------------- english briefing (Web Speech API) ---------------- */
  var EB_RATES = [{ v: 0.8, l: "0.8x" }, { v: 0.9, l: "0.9x" }, { v: 1, l: "1.0x" }, { v: 1.15, l: "1.15x" }];
  var EB = {
    supported: !!(window.speechSynthesis && window.SpeechSynthesisUtterance),
    data: null, date: null, rate: 1, idx: 0,
    playing: false, paused: false, gen: 0, utt: null, voice: null, voiceBound: false,
    manualPause: false
  };

  try {
    addEventListener("pagehide", function () { try { window.speechSynthesis.cancel(); } catch (e) {} });
  } catch (e) {}

  function ebEsc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function ebPickVoice() {
    var all = [];
    try { all = window.speechSynthesis.getVoices() || []; } catch (e) { all = []; }
    var en = all.filter(function (v) { return /^en([-_]|$)/i.test(v.lang || ""); });
    if (!en.length) return null;
    var us = en.filter(function (v) { return /^en[-_]US/i.test(v.lang || ""); });
    var pool = us.length ? us : en;
    var pref = ["Google US English", "Samantha", "Ava", "Allison", "Microsoft Aria", "Microsoft Jenny", "Microsoft Zira", "Microsoft Mark", "Alex", "Daniel"];
    for (var i = 0; i < pref.length; i++) {
      for (var j = 0; j < pool.length; j++) {
        if ((pool[j].name || "").indexOf(pref[i]) !== -1) return pool[j];
      }
    }
    return pool[0];
  }

  function ebBindVoices() {
    if (!EB.supported || EB.voiceBound) return;
    EB.voiceBound = true;
    EB.voice = ebPickVoice();
    try {
      window.speechSynthesis.addEventListener("voiceschanged", function () { EB.voice = ebPickVoice(); });
    } catch (e) {
      try { window.speechSynthesis.onvoiceschanged = function () { EB.voice = ebPickVoice(); }; } catch (e2) {}
    }
  }

  function ebUpdateUI() {
    var list = $("ebList");
    if (list) {
      var active = (EB.playing || EB.paused) ? EB.idx : -1;
      Array.prototype.forEach.call(list.children, function (li, i) {
        if (i === active) { li.classList.add("on"); li.setAttribute("aria-current", "true"); }
        else { li.classList.remove("on"); li.removeAttribute("aria-current"); }
      });
      // 모바일에서 리스트가 자체 스크롤될 때만 안쪽으로 따라가게 한다(페이지는 건드리지 않음).
      if (active >= 0 && list.scrollHeight > list.clientHeight + 4 && list.children[active]) {
        var lr = list.getBoundingClientRect(), ir = list.children[active].getBoundingClientRect();
        if (ir.top < lr.top) list.scrollTop -= (lr.top - ir.top) + 8;
        else if (ir.bottom > lr.bottom) list.scrollTop += (ir.bottom - lr.bottom) + 8;
      }
    }
    var play = $("ebPlay");
    if (play) {
      play.innerHTML = EB.playing ? "⏸ Pause" : (EB.paused ? "▶ Resume" : "▶ Play");
      play.setAttribute("aria-pressed", EB.playing ? "true" : "false");
    }
    var stop = $("ebStop");
    if (stop) stop.disabled = !(EB.playing || EB.paused);
  }

  function ebSpeakCurrent(gen) {
    if (gen !== EB.gen) return;
    var d = EB.data;
    if (!d) { EB.playing = false; EB.paused = false; ebUpdateUI(); return; }
    var sents = d.sentences || [];
    if (EB.idx >= sents.length) {
      EB.playing = false; EB.paused = false; EB.idx = 0; ebUpdateUI(); return;
    }
    var u = new window.SpeechSynthesisUtterance(sents[EB.idx]);
    u.lang = (EB.voice && EB.voice.lang) || "en-US";
    if (EB.voice) u.voice = EB.voice;
    u.rate = EB.rate;
    u.pitch = 1;
    u.volume = 1;
    u.onend = function () {
      if (gen !== EB.gen) return;
      EB.idx += 1;
      ebUpdateUI();
      ebSpeakCurrent(gen);
    };
    u.onerror = function (e) {
      if (gen !== EB.gen) return;
      var err = (e && e.error) || "";
      if (err === "interrupted" || err === "canceled") return;
      EB.playing = false; EB.paused = false; ebUpdateUI();
    };
    EB.utt = u;
    try { window.speechSynthesis.speak(u); } catch (e) {
      EB.playing = false; EB.paused = false; ebUpdateUI();
    }
    ebUpdateUI();
  }

  function ebSpeakFrom(start) {
    if (!EB.supported || !EB.data) return;
    var sents = EB.data.sentences || [];
    if (!sents.length) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    EB.gen += 1;
    var s = parseInt(start, 10);
    if (isNaN(s) || s < 0) s = 0;
    if (s >= sents.length) s = 0;
    EB.idx = s;
    EB.playing = true;
    EB.paused = false;
    EB.manualPause = false;
    ebSpeakCurrent(EB.gen);
  }

  function ebPause() {
    if (!EB.supported || !EB.playing) return;
    EB.playing = false;
    EB.paused = true;
    EB.manualPause = true;
    try { window.speechSynthesis.pause(); } catch (e) {}
    ebUpdateUI();
    // Android Chrome 등 pause()가 동작하지 않는 환경: 현재 문장까지만 멈춘 것으로 처리
    setTimeout(function () {
      if (!EB.manualPause || !EB.paused) return;
      var stillRunning = false;
      try { stillRunning = window.speechSynthesis.speaking && !window.speechSynthesis.paused; } catch (e) { stillRunning = false; }
      if (stillRunning) {
        EB.gen += 1;
        try { window.speechSynthesis.cancel(); } catch (e) {}
        ebUpdateUI();
      }
    }, 400);
  }

  function ebResume() {
    if (!EB.supported) return;
    EB.manualPause = false;
    if (EB.paused) {
      var wasPaused = false;
      try { wasPaused = window.speechSynthesis.paused; } catch (e) { wasPaused = false; }
      if (wasPaused) {
        EB.paused = false; EB.playing = true;
        try { window.speechSynthesis.resume(); } catch (e) { ebSpeakFrom(EB.idx); }
        ebUpdateUI();
      } else {
        ebSpeakFrom(EB.idx);
      }
      return;
    }
    ebSpeakFrom(EB.idx);
  }

  function ebStop() {
    EB.manualPause = false;
    EB.gen += 1;
    EB.playing = false;
    EB.paused = false;
    EB.idx = 0;
    if (EB.supported) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    ebUpdateUI();
  }

  function ebSetRate(v) {
    EB.rate = v;
    var box = $("enBrief");
    if (box) {
      Array.prototype.forEach.call(box.querySelectorAll(".ebrates button"), function (b) {
        b.setAttribute("aria-pressed", Math.abs(parseFloat(b.getAttribute("data-rate")) - v) < 0.001 ? "true" : "false");
      });
    }
    if (EB.playing) ebSpeakFrom(EB.idx);
  }

  function renderEnglish(rep) {
    var box = $("enBrief");
    if (!box) return;
    var d = (rep && rep.englishBriefing && (rep.englishBriefing.sentences || []).length) ? rep.englishBriefing : null;
    if (!d) {
      if (EB.data) ebStop();
      EB.data = null; EB.date = null;
      box.hidden = true;
      box.innerHTML = "";
      return;
    }
    if (EB.date === rep.date && box.innerHTML) return; // 같은 날짜: 재생 상태 유지
    ebStop();
    EB.data = d; EB.date = rep.date;
    ebBindVoices();

    var sents = d.sentences || [];
    var sup = EB.supported;
    var ctrl = sup
      ? '<button type="button" class="ebbtn" id="ebPlay" aria-pressed="false">▶ Play</button>' +
        '<button type="button" class="ebbtn ghost" id="ebStop" disabled>⏹ Stop</button>' +
        '<div class="ebrates" role="group" aria-label="재생 속도">' + EB_RATES.map(function (r) {
          return '<button type="button" data-rate="' + r.v + '" aria-pressed="' + (Math.abs(EB.rate - r.v) < 0.001 ? "true" : "false") + '">' + r.l + "</button>";
        }).join("") + "</div>" +
        '<span class="eb-note">문장을 누르면 그 문장부터 재생 · 영어 음성 자동 선택</span>'
      : '<span class="eb-note warn">이 브라우저는 음성 재생을 지원하지 않습니다. 아래 스크립트는 그대로 읽으실 수 있습니다.</span>';

    box.innerHTML =
      '<div class="wrap"><div class="enbrief-in">' +
        '<div class="eb-head">' +
          '<span class="eb-flag" aria-hidden="true">🇺🇸</span>' +
          '<div class="eb-titles">' +
            '<h2 id="ebH">English Briefing <span class="eb-k">Listen &amp; Read</span></h2>' +
            '<p class="eb-title">' + ebEsc(d.title || "Health supplement market briefing") +
              (d.duration ? ' <span class="eb-dur">· ' + ebEsc(d.duration) + "</span>" : "") + "</p>" +
          "</div>" +
          '<button type="button" class="ebbtn ghost eb-toggle" id="ebToggle" aria-expanded="true" aria-controls="ebList">접기</button>' +
        "</div>" +
        '<div class="eb-ctrl">' + ctrl + "</div>" +
        '<ol class="eb-list' + (sup ? "" : " noaudio") + '" id="ebList">' +
          sents.map(function (s, i) {
            return '<li data-i="' + i + '"><span class="n">' + (i < 9 ? "0" : "") + (i + 1) + '</span><span class="t" lang="en">' + ebEsc(s) + "</span></li>";
          }).join("") +
        "</ol>" +
      "</div></div>";

    box.hidden = false;

    var playBtn = $("ebPlay");
    if (playBtn) playBtn.addEventListener("click", function () {
      if (EB.playing) ebPause(); else ebResume();
    });
    var stopBtn = $("ebStop");
    if (stopBtn) stopBtn.addEventListener("click", ebStop);
    Array.prototype.forEach.call(box.querySelectorAll(".ebrates button"), function (b) {
      b.addEventListener("click", function () { ebSetRate(parseFloat(b.getAttribute("data-rate"))); });
    });
    if (sup) {
      Array.prototype.forEach.call($("ebList").children, function (li) {
        li.addEventListener("click", function () { ebSpeakFrom(parseInt(li.getAttribute("data-i"), 10) || 0); });
      });
    }
    var toggle = $("ebToggle");
    if (toggle) toggle.addEventListener("click", function () {
      var list = $("ebList");
      if (!list) return;
      var hide = !list.hidden;
      list.hidden = hide;
      toggle.setAttribute("aria-expanded", hide ? "false" : "true");
      toggle.textContent = hide ? "스크립트 열기" : "접기";
    });
    ebUpdateUI();
  }

  /* ---------------- navigation ---------------- */
  function syncHash() {
    var h = state.period + "/" + (state.date || "") + "/" + state.view;
    try { history.replaceState(null, "", "#" + h); }
    catch (e) { location.hash = h; }
  }

  function render() {
    renderBar();
    var isDaily = state.period === "daily";
    var rep = getReport(state.period, state.date);
    state.current = rep || null;

    if (rep && rep.views) {
      renderViewTabs(true);
      renderHeader(rep);
      renderFooter(rep);
      renderPanel(rep);
    } else if (isDaily) {
      renderViewTabs(false);
      renderHeader(getReport("daily", latestDate("daily")) || null);
      $("reportView").innerHTML = '<div class="loaderr">리포트 데이터를 불러오지 못했습니다. 잠시 후 새로고침하거나 ' +
        '<a href="./data/manifest.json">data/manifest.json</a>을 확인해 주세요.</div>';
    } else {
      renderViewTabs(false);
      renderHeader(getReport("daily", latestDate("daily")) || null);
      renderPeriodHeader(state.period);
      renderFooter(getReport("daily", latestDate("daily")) || null);
      renderPlaceholder(state.period);
    }
    bindNav();
    renderEnglish(rep);
    syncHash();
  }

  function goDate(d) {
    if (!d) return;
    ebStop();
    state.date = d;
    loadReport(state.period, d).then(function (r) {
      if (!r && state.period !== "daily") { render(); return; }
      render();
    });
  }

  function switchPeriod(p) {
    ebStop();
    state.period = p;
    var d = latestDate(p);
    state.date = d || null;
    state.view = "summary";
    if (d) {
      loadReport(p, d).then(function () { render(); });
    } else {
      render();
    }
  }

  function bindNav() {
    document.querySelectorAll(".periods button[data-period]").forEach(function (b) {
      b.onclick = function () { switchPeriod(b.getAttribute("data-period")); };
    });
    document.querySelectorAll("#viewTabs button[data-view]").forEach(function (b) {
      b.onclick = function () {
        ebStop();
        state.view = b.getAttribute("data-view");
        renderViewTabs(true);
        var rep = state.current;
        if (rep && rep.views) renderPanel(rep);
        bindNav();
        syncHash();
        var bar = $("viewBar");
        if (bar) {
          var y = bar.getBoundingClientRect().top + window.pageYOffset - 50;
          if (window.pageYOffset > y) window.scrollTo(0, y);
        }
      };
    });
    var sel = $("dateSel");
    if (sel) sel.onchange = function () { if (sel.value) goDate(sel.value); };
    $("prevBtn").onclick = function () {
      var dates = listFor(state.period), i = dates.indexOf(state.date);
      if (i > 0) goDate(dates[i - 1]);
    };
    $("nextBtn").onclick = function () {
      var dates = listFor(state.period), i = dates.indexOf(state.date);
      if (i >= 0 && i < dates.length - 1) goDate(dates[i + 1]);
    };
  }

  function parseHash() {
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return null;
    var p = h.split("/");
    if (PERIODS.indexOf(p[0]) !== -1) {
      return { period: p[0], date: p[1] || null, view: p[2] || "summary" };
    }
    if (VIEWS.some(function (v) { return v.id === h; })) return { view: h };
    return null;
  }

  /* ---------------- init ---------------- */
  async function init() {
    try {
      var m = await fetchJSON("./data/manifest.json");
      if (m && Array.isArray(m.daily)) state.manifest = m;
    } catch (e) {
      state.offline = true;
    }
    if (!state.manifest.daily) state.manifest.daily = [];
    if (!state.manifest.weekly) state.manifest.weekly = [];
    if (!state.manifest.monthly) state.manifest.monthly = [];

    var hash = parseHash();
    if (hash) {
      if (hash.period) state.period = hash.period;
      if (hash.view) state.view = hash.view;
    }

    var dates = listFor("daily").slice(-60);
    await Promise.all(dates.map(function (d) { return loadReport("daily", d); }));

    if (hash && hash.date) state.date = hash.date;
    if (!state.date || listFor(state.period).indexOf(state.date) === -1) {
      state.date = latestDate(state.period);
    }
    // 주간·월간에 아직 데이터가 없으면 일일 날짜로 대체하지 않는다(기간 혼동 방지).
    if (!state.date && state.period === "daily") state.date = latestDate("daily");

    if (state.date) await loadReport(state.period, state.date);
    if (VIEWS.every(function (v) { return v.id !== state.view; })) state.view = "summary";
    if (!state.period || PERIODS.indexOf(state.period) === -1) state.period = "daily";
    render();
    if (/(?:^|[?&])debug=1(?:&|$)/.test(location.search)) {
      window.__dashDebug = { state: state, render: render };
    }
  }

  init();
})();
</script>
</body>
</html>
